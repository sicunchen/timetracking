<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bottles</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,400;1,300&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Mono',monospace;padding:1.5rem;max-width:700px;margin:0 auto;min-height:100vh;background:#fafaf8;color:#1a1a18}
.title-block{text-align:center;margin-bottom:1.5rem}
.title-main{font-family:'Fraunces',serif;font-weight:300;font-size:30px;font-style:italic;color:#1a1a18;display:block}
.title-sub{font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:#aaa;display:block;margin-top:3px}
.week-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:2rem}
.week-title{font-size:12px;color:#888;letter-spacing:0.08em;text-transform:uppercase}
.week-nav{display:flex;gap:6px}
.week-nav button{background:none;border:0.5px solid #ccc;color:#888;font-family:'DM Mono',monospace;font-size:11px;padding:4px 10px;border-radius:4px;cursor:pointer;transition:all 0.15s}
.week-nav button:hover{background:#f0f0ee;color:#1a1a18}
.save-status{font-size:10px;color:#aaa;text-align:center;margin-bottom:1rem;min-height:14px;letter-spacing:0.05em}
.bottles-row{display:flex;justify-content:center;gap:1.1rem;align-items:flex-end;padding:1rem 0 0.75rem;flex-wrap:wrap}
.bottle-wrap{display:flex;flex-direction:column;align-items:center;gap:10px;cursor:pointer;transition:transform 0.25s cubic-bezier(0.34,1.56,0.64,1);width:80px}
.bottle-wrap:hover{transform:translateY(-8px) scale(1.04)}
.bottle-label{text-align:center}
.bottle-label .zh{font-size:13px;font-family:'Fraunces',serif;font-weight:300;display:block;color:#1a1a18;margin-bottom:1px}
.bottle-label .en{font-size:9px;letter-spacing:0.07em;text-transform:uppercase;color:#888;display:block}

/* modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.35);display:flex;align-items:center;justify-content:center;z-index:100;opacity:0;pointer-events:none;transition:opacity 0.2s}
.modal-overlay.open{opacity:1;pointer-events:all}
.modal{background:#fff;border:0.5px solid #e0e0dc;border-radius:16px;padding:1.5rem;width:340px;max-width:92vw;transform:translateY(12px) scale(0.97);transition:transform 0.25s cubic-bezier(0.34,1.56,0.64,1)}
.modal-overlay.open .modal{transform:translateY(0) scale(1)}
.modal-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:4px}
.modal-zone-name{font-family:'Fraunces',serif;font-weight:300;font-size:22px;color:#1a1a18}
.modal-dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:8px;vertical-align:middle}
.modal-close{background:none;border:none;cursor:pointer;color:#bbb;font-size:20px;padding:0;line-height:1;transition:color 0.15s}
.modal-close:hover{color:#1a1a18}
.modal-zone-desc{font-size:11px;color:#888;line-height:1.6;margin-bottom:1rem;padding-bottom:1rem;border-bottom:0.5px solid #f0f0ec}
.modal-examples{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:1.25rem;padding-bottom:1.25rem;border-bottom:0.5px solid #f0f0ec}
.example-chip{font-size:10px;padding:3px 8px;border-radius:20px;border:0.5px solid #e0e0dc;color:#888;background:#f8f8f6;font-family:'DM Mono',monospace;cursor:pointer;transition:all 0.15s}
.example-chip:hover{color:#1a1a18;border-color:#bbb}
.form-label{font-size:10px;letter-spacing:0.08em;text-transform:uppercase;color:#888;display:block;margin-bottom:6px}
.form-row{margin-bottom:0.9rem}
.form-input{width:100%;font-family:'DM Mono',monospace;font-size:13px;padding:8px 10px;border:0.5px solid #e0e0dc;border-radius:8px;background:#f8f8f6;color:#1a1a18;outline:none;transition:border-color 0.15s}
.form-input:focus{border-color:#bbb;background:#fff}
.time-row{display:flex;gap:8px;margin-bottom:0.9rem}
.time-row .form-row{flex:1;margin-bottom:0}
.hours-row{display:flex;gap:8px;align-items:center}
.hours-input{width:80px;font-family:'DM Mono',monospace;font-size:13px;padding:8px 10px;border:0.5px solid #e0e0dc;border-radius:8px;background:#f8f8f6;color:#1a1a18;outline:none;transition:border-color 0.15s;text-align:center}
.hours-input:focus{border-color:#bbb;background:#fff}
.hours-unit{font-size:11px;color:#bbb}
.sleep-duration{font-size:12px;color:#888;margin-bottom:1rem;font-family:'DM Mono',monospace;min-height:18px}
.modal-add-btn{width:100%;padding:9px;border-radius:8px;border:0.5px solid #e0e0dc;background:none;font-family:'DM Mono',monospace;font-size:12px;color:#888;cursor:pointer;transition:all 0.15s;letter-spacing:0.04em}
.modal-add-btn:hover{background:#f8f8f6;color:#1a1a18}
.modal-entries{margin-top:1rem;display:flex;flex-direction:column;gap:4px;max-height:130px;overflow-y:auto}
.entry-item{display:flex;align-items:center;gap:8px;font-size:11px;padding:5px 8px;background:#f8f8f6;border-radius:6px;color:#1a1a18}
.entry-text{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.entry-hrs{flex-shrink:0;color:#888}
.entry-remove{background:none;border:none;cursor:pointer;color:#bbb;font-size:14px;padding:0;transition:color 0.15s;flex-shrink:0}
.entry-remove:hover{color:#e24b4a}
.total-row{margin-top:8px;font-size:11px;color:#888;text-align:right;letter-spacing:0.04em}

/* celebration */
.celebration{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:200;pointer-events:none;opacity:0;transition:opacity 0.4s}
.celebration.show{opacity:1}
.celebration-text{font-family:'Fraunces',serif;font-weight:300;font-size:32px;color:#1a1a18;text-align:center;line-height:1.5;padding:2rem 2.5rem;background:#fff;border-radius:20px;border:0.5px solid #e0e0dc}
.confetti-piece{position:absolute;animation:fall linear forwards}
@keyframes fall{0%{transform:translateY(-20px) rotate(0deg);opacity:1}100%{transform:translateY(600px) rotate(720deg);opacity:0}}

/* loading */
.loading{text-align:center;padding:3rem;font-size:12px;color:#aaa;letter-spacing:0.08em}
</style>
</head>
<body>

<div class="week-header">
  <div class="week-title" id="weekLabel">—</div>
  <div class="week-nav">
    <button onclick="changeWeek(-1)">← prev</button>
    <button onclick="changeWeek(0)">this week</button>
    <button onclick="changeWeek(1)">next →</button>
  </div>
</div>

<div class="save-status" id="saveStatus"></div>
<div id="bottlesRow" class="bottles-row"><div class="loading">loading…</div></div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-top">
      <div class="modal-zone-name" id="modalName"></div>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-zone-desc" id="modalDesc"></div>
    <div id="sleepForm" style="display:none">
      <div class="form-row">
        <label class="form-label">date</label>
        <input class="form-input" type="date" id="sleepDate">
      </div>
      <div class="time-row">
        <div class="form-row">
          <label class="form-label">bed time</label>
          <input class="form-input" type="time" id="bedTime" oninput="calcDuration()">
        </div>
        <div class="form-row">
          <label class="form-label">wake up</label>
          <input class="form-input" type="time" id="wakeTime" oninput="calcDuration()">
        </div>
      </div>
      <div class="sleep-duration" id="sleepDuration"></div>
      <button class="modal-add-btn" onclick="addSleepEntry()">+ log it</button>
      <div class="modal-entries" id="sleepEntries"></div>
      <div class="total-row" id="sleepTotal"></div>
    </div>
    <div id="regularForm" style="display:none">
      <div class="modal-examples" id="modalExamples"></div>
      <div class="form-row">
        <label class="form-label">what did you do</label>
        <input class="form-input" id="activityInput" placeholder="or tap an example above" onkeydown="if(event.key==='Enter')document.getElementById('hoursInput').focus()">
      </div>
      <div class="form-row">
        <label class="form-label">how long</label>
        <div class="hours-row">
          <input class="hours-input" id="hoursInput" type="number" min="0.25" max="24" step="0.25" value="1" onkeydown="if(event.key==='Enter')addEntry()">
          <span class="hours-unit">hrs</span>
        </div>
      </div>
      <button class="modal-add-btn" onclick="addEntry()">+ log it</button>
      <div class="modal-entries" id="modalEntries"></div>
      <div class="total-row" id="modalTotal"></div>
    </div>
  </div>
</div>

<div class="celebration" id="celebration">
  <div class="celebration-text">🌟<br>六区全满<br><span style="font-size:16px;opacity:0.6;font-family:'DM Mono',monospace">本周的你，完整而充实</span></div>
</div>

<script>
// ── CONFIG — paste your Apps Script Web App URL here ──────────────
const SCRIPT_URL = 'YOUR_SCRIPT_URL_HERE';
const SHEET = 'BottlesData';
// ─────────────────────────────────────────────────────────────────

const ZONES=[
  {id:'produce',zh:'产出',en:'Producing',target:45,h:'#c44a22',m:'#e8693d',l:'#f5a882',liquid:'#e8693d',liquidL:'#f5b99e',
   desc:'Externally legible output. Energy flows outward toward systems that evaluate you.',
   examples:['work tasks','OMSCS assignments']},
  {id:'build',zh:'建构',en:'Building',target:5,h:'#0d4f8c',m:'#1a6abf',l:'#72aae0',liquid:'#2178d4',liquidL:'#85b8e8',
   desc:'Self-directed investment in a future version of you. No immediate payoff — the return is months out.',
   examples:['LinkedIn cold outreach','informational interviews','portfolio projects','resume & cover letters','career research & planning']},
  {id:'maintain',zh:'维持',en:'Maintaining',target:6,h:'#555552',m:'#78776f',l:'#b0afa6',liquid:'#888780',liquidL:'#b8b7af',
   desc:'Servicing external systems attached to your life. Costs more attention than it appears.',
   examples:['wedding logistics & vendors','apartment chores & cleaning','groceries & errands','health & insurance admin','bills & finances','family obligation calls']},
  {id:'restore',zh:'滋养',en:'Restoring',target:20,h:'#085040',m:'#0f6e56',l:'#4da88a',liquid:'#1a8c6e',liquidL:'#5dbfa0',
   desc:'Active engagement that refills you. Not generic rest — specific inputs you show up for with full presence.',
   examples:['weightlifting','tennis','cycling','art house movies','documentaries','reading','runway & fashion catalogs','Chicago city exploration','ikebana','Are.na moodboarding','watching & editing tennis']},
  {id:'float',zh:'悬浮',en:'Floating',target:25,h:'#332d8f',m:'#4a3ab7',l:'#8a80d4',liquid:'#5a4fd0',liquidL:'#9b92e0',
   desc:'Undirected time — neither depleting nor restoring. Includes necessary daily transitions. Non-judgmental.',
   examples:['commute','meals','shower','scrolling Instagram','scrolling 小红书','transition time','doing nothing']},
  {id:'sleep',zh:'睡眠',en:'Sleep',target:63,h:'#1a1a3a',m:'#2e2b6e',l:'#6b68a8',liquid:'#3d3a8c',liquidL:'#7e7bbf',
   desc:'Non-negotiable recovery. 9h × 7 nights — during heavy cognitive load, sleep demand rises. This is physiology, not laziness.',
   examples:[]},
];

// ── State ─────────────────────────────────────────────────────────
let currentOffset=0, activeZone=null;
let _cache={}, _saveTimer=null;

// ── Week helpers ──────────────────────────────────────────────────
function getWeekKey(o=0){
  const d=new Date(); d.setDate(d.getDate()-d.getDay()+1+o*7); d.setHours(0,0,0,0);
  return d.toISOString().slice(0,10);
}
function getWeekLabel(o=0){
  const d=new Date(); d.setDate(d.getDate()-d.getDay()+1+o*7);
  const e=new Date(d); e.setDate(e.getDate()+6);
  const f=x=>x.toLocaleDateString('en',{month:'short',day:'numeric'});
  return `${f(d)} — ${f(e)}`;
}
function gwk(){return getWeekKey(currentOffset);}

// ── Backend ───────────────────────────────────────────────────────
function _getWeek(wk){
  if(!_cache[wk])_cache[wk]={data:{},log:[],media:{}};
  return _cache[wk];
}
function ld(wk){return _getWeek(wk).data;}
function ll(wk){return _getWeek(wk).log;}

function _jsonp(url){
  return new Promise((resolve,reject)=>{
    const cb='_gs_cb_'+Date.now();
    const s=document.createElement('script');
    window[cb]=(data)=>{delete window[cb];document.head.removeChild(s);resolve(data);};
    s.onerror=()=>{delete window[cb];document.head.removeChild(s);reject(new Error('JSONP failed'));};
    s.src=url+(url.includes('?')?'&':'?')+'callback='+cb;
    document.head.appendChild(s);
  });
}

async function _loadAll(){
  try{
    const all=await _jsonp(`${SCRIPT_URL}?action=getAll&sheet=${SHEET}`);
    for(const[k,v] of Object.entries(all)) _cache[k]=v;
  }catch(e){console.warn('Load failed:',e);}
}

function _scheduleSave(wk){
  clearTimeout(_saveTimer);
  setStatus('saving…');
  _saveTimer=setTimeout(()=>_saveWeek(wk),1200);
}

async function _saveWeek(wk){
  const w=_getWeek(wk);
  try{
    await fetch(SCRIPT_URL,{
      method:'POST', mode:'no-cors',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({week:wk, data:w.data, log:w.log, media:w.media||{}, sheet:SHEET})
    });
    setStatus('saved ✓');
    setTimeout(()=>setStatus(''),2000);
  }catch(e){
    console.warn('Save failed:',e);
    setStatus('⚠ save failed');
  }
}

function setStatus(s){
  const el=document.getElementById('saveStatus');
  if(el) el.textContent=s;
}

function sd(wk,d){_getWeek(wk).data=d;_scheduleSave(wk);}
function sl(wk,l){_getWeek(wk).log=l;_scheduleSave(wk);}
function getZoneHours(d,z){return(d[z+'_entries']||[]).reduce((s,e)=>s+e.hours,0);}

// ── Bottle SVG ────────────────────────────────────────────────────
function makeBottleSVG(z,hrs){
  const pct=Math.min(1,hrs/z.target);
  const W=66,H=155,bW=48,bH=84,bX=(W-bW)/2,bY=50,nW=20,nH=26,nX=(W-nW)/2,nY=24,sH=13;
  const fillAmt=Math.round((bH+sH)*pct),fillY=bY+bH-Math.max(0,fillAmt-sH);
  const defs=`<defs>
    <linearGradient id="bg_${z.id}" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="${z.h}" stop-opacity="0.18"/>
      <stop offset="35%" stop-color="${z.m}" stop-opacity="0.08"/>
      <stop offset="65%" stop-color="${z.m}" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="${z.h}" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="body_${z.id}" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="${z.h}"/>
      <stop offset="18%" stop-color="${z.m}"/>
      <stop offset="82%" stop-color="${z.m}"/>
      <stop offset="100%" stop-color="${z.h}"/>
    </linearGradient>
    <linearGradient id="liq_${z.id}" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="${z.h}" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="${z.liquidL}" stop-opacity="0.95"/>
      <stop offset="70%" stop-color="${z.liquid}" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="${z.h}" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="shine_${z.id}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="white" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cap_${z.id}" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="${z.h}"/>
      <stop offset="40%" stop-color="${z.l}"/>
      <stop offset="100%" stop-color="${z.h}"/>
    </linearGradient>
    <clipPath id="clip_${z.id}">
      <path d="M${nX},${nY} L${nX},${nY+nH} Q${nX},${nY+nH+sH} ${bX},${bY+sH} L${bX},${bY+bH} Q${bX},${bY+bH+6} ${bX+6},${bY+bH+6} L${bX+bW-6},${bY+bH+6} Q${bX+bW},${bY+bH+6} ${bX+bW},${bY+bH} L${bX+bW},${bY+sH} Q${bX+bW},${nY+nH+sH} ${nX+nW},${nY+nH} L${nX+nW},${nY} Z"/>
    </clipPath>
  </defs>`;
  const shape=`<path d="M${nX+1},${nY} L${nX+1},${nY+nH} Q${nX+1},${nY+nH+sH} ${bX+1},${bY+sH} L${bX+1},${bY+bH} Q${bX+1},${bY+bH+5} ${bX+7},${bY+bH+5} L${bX+bW-7},${bY+bH+5} Q${bX+bW-1},${bY+bH+5} ${bX+bW-1},${bY+bH} L${bX+bW-1},${bY+sH} Q${bX+bW-1},${nY+nH+sH} ${nX+nW-1},${nY+nH} L${nX+nW-1},${nY} Z" fill="url(#bg_${z.id})" stroke="url(#body_${z.id})" stroke-width="1.2"/>`;
  const liquid=fillAmt>0?`<rect x="${bX+1}" y="${fillY}" width="${bW-2}" height="${bY+bH-fillY+5}" fill="url(#liq_${z.id})" clip-path="url(#clip_${z.id})"/>`:'';
  const shine=`<rect x="${nX+3}" y="${nY+2}" width="5" height="${nH+sH+18}" rx="2.5" fill="url(#shine_${z.id})" opacity="0.6"/>`;
  const cap=pct>=1
    ?`<rect x="${nX-2}" y="${nY-8}" width="${nW+4}" height="12" rx="4" fill="url(#cap_${z.id})"/><rect x="${nX+3}" y="${nY-11}" width="${nW-6}" height="6" rx="2" fill="${z.m}"/>`
    :`<rect x="${nX-1}" y="${nY-4}" width="${nW+2}" height="6" rx="2" fill="url(#body_${z.id})" opacity="0.4"/>`;
  const label=`<text x="${W/2}" y="${H-2}" text-anchor="middle" font-family="DM Mono,monospace" font-size="10" fill="${z.m}">${hrs.toFixed(1)}h</text>`;
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${defs}${shape}${liquid}${shine}${cap}${label}</svg>`;
}

// ── Render ────────────────────────────────────────────────────────
function renderBottles(){
  const wk=gwk(), data=ld(wk);
  document.getElementById('weekLabel').textContent=getWeekLabel(currentOffset)+(currentOffset===0?' · this week':'');
  const row=document.getElementById('bottlesRow');
  row.innerHTML='';
  ZONES.forEach(z=>{
    const hrs=getZoneHours(data,z.id);
    const wrap=document.createElement('div');
    wrap.className='bottle-wrap';
    wrap.onclick=()=>openModal(z.id);
    wrap.innerHTML=`${makeBottleSVG(z,hrs)}<div class="bottle-label"><span class="zh">${z.zh}</span><span class="en">${z.en} · ${z.target}h</span></div>`;
    row.appendChild(wrap);
  });
}

// ── Modal ─────────────────────────────────────────────────────────
function openModal(zid){
  activeZone=zid;
  const z=ZONES.find(x=>x.id===zid), wk=gwk(), data=ld(wk);
  document.getElementById('modalName').innerHTML=`<span class="modal-dot" style="background:${z.m}"></span>${z.zh} — ${z.en}`;
  document.getElementById('modalDesc').textContent=z.desc;
  if(zid==='sleep'){
    document.getElementById('sleepForm').style.display='block';
    document.getElementById('regularForm').style.display='none';
    document.getElementById('sleepDate').value=new Date().toISOString().slice(0,10);
    document.getElementById('bedTime').value='';
    document.getElementById('wakeTime').value='';
    document.getElementById('sleepDuration').textContent='';
    renderSleepEntries(data.sleep_entries||[],data);
    setTimeout(()=>document.getElementById('bedTime').focus(),200);
  } else {
    document.getElementById('sleepForm').style.display='none';
    document.getElementById('regularForm').style.display='block';
    document.getElementById('modalExamples').innerHTML=z.examples.map(e=>`<span class="example-chip" onclick="useExample('${e.replace(/'/g,"\\'")}')">${e}</span>`).join('');
    document.getElementById('activityInput').value='';
    document.getElementById('hoursInput').value='1';
    renderModalEntries(data[zid+'_entries']||[],z,data);
    setTimeout(()=>document.getElementById('activityInput').focus(),200);
  }
  document.getElementById('modalOverlay').classList.add('open');
}

function useExample(t){document.getElementById('activityInput').value=t;document.getElementById('hoursInput').focus();}
function closeModal(){document.getElementById('modalOverlay').classList.remove('open');activeZone=null;}
document.getElementById('modalOverlay').addEventListener('click',e=>{if(e.target===e.currentTarget)closeModal();});

function renderModalEntries(entries,z,data){
  const total=getZoneHours(data,z.id);
  document.getElementById('modalEntries').innerHTML=entries.length
    ?entries.map((e,i)=>`<div class="entry-item"><span style="color:${z.m};flex-shrink:0">▸</span><span class="entry-text">${e.activity}</span><span class="entry-hrs">${e.hours}h</span><button class="entry-remove" onclick="removeEntry(${i})">×</button></div>`).join('')
    :'';
  document.getElementById('modalTotal').textContent=entries.length?`total ${total.toFixed(1)}h / ${z.target}h`:'';
}

function renderSleepEntries(entries,data){
  const z=ZONES.find(x=>x.id==='sleep'), total=getZoneHours(data,'sleep');
  document.getElementById('sleepEntries').innerHTML=entries.length
    ?entries.map((e,i)=>`<div class="entry-item"><span style="color:${z.m};flex-shrink:0">▸</span><span class="entry-text">${e.activity}</span><span class="entry-hrs">${e.hours.toFixed(1)}h</span><button class="entry-remove" onclick="removeSleepEntry(${i})">×</button></div>`).join('')
    :'';
  document.getElementById('sleepTotal').textContent=entries.length?`total ${total.toFixed(1)}h / ${z.target}h`:'';
}

// ── Add / Remove entries ──────────────────────────────────────────
function addEntry(){
  const act=document.getElementById('activityInput').value.trim();
  const hrs=parseFloat(document.getElementById('hoursInput').value)||0;
  if(!act||hrs<=0)return;
  const wk=gwk(), data=ld(wk);
  const key=activeZone+'_entries';
  if(!data[key])data[key]=[];
  data[key].push({activity:act,hours:hrs,id:Date.now()});
  sd(wk,data);
  document.getElementById('activityInput').value='';
  document.getElementById('hoursInput').value='1';
  const z=ZONES.find(x=>x.id===activeZone);
  renderModalEntries(data[key],z,data);
  renderBottles();
  checkAllFull(data);
  setTimeout(()=>document.getElementById('activityInput').focus(),50);
}

function removeEntry(idx){
  const wk=gwk(), data=ld(wk);
  const key=activeZone+'_entries';
  data[key].splice(idx,1);
  sd(wk,data);
  const z=ZONES.find(x=>x.id===activeZone);
  renderModalEntries(data[key]||[],z,data);
  renderBottles();
}

function calcDuration(){
  const bed=document.getElementById('bedTime').value, wake=document.getElementById('wakeTime').value;
  const el=document.getElementById('sleepDuration');
  if(!bed||!wake){el.textContent='';return;}
  const [bh,bm]=bed.split(':').map(Number),[wh,wm]=wake.split(':').map(Number);
  let mins=(wh*60+wm)-(bh*60+bm); if(mins<=0)mins+=1440;
  const h=Math.floor(mins/60),m=mins%60;
  el.innerHTML=`<span style="color:#1a1a18">${h}h${m>0?' '+m+'m':''}</span> of sleep`;
}

function addSleepEntry(){
  const date=document.getElementById('sleepDate').value;
  const bed=document.getElementById('bedTime').value;
  const wake=document.getElementById('wakeTime').value;
  if(!date||!bed||!wake)return;
  const [bh,bm]=bed.split(':').map(Number),[wh,wm]=wake.split(':').map(Number);
  let mins=(wh*60+wm)-(bh*60+bm); if(mins<=0)mins+=1440;
  const hrs=parseFloat((mins/60).toFixed(2));
  const wk=gwk(), data=ld(wk);
  if(!data.sleep_entries)data.sleep_entries=[];
  data.sleep_entries.push({activity:`${date} · ${bed}–${wake}`,hours:hrs,id:Date.now()});
  sd(wk,data);
  document.getElementById('sleepDate').value='';
  document.getElementById('bedTime').value='';
  document.getElementById('wakeTime').value='';
  document.getElementById('sleepDuration').textContent='';
  renderSleepEntries(data.sleep_entries,data);
  renderBottles();
  checkAllFull(data);
}

function removeSleepEntry(idx){
  const wk=gwk(), data=ld(wk);
  data.sleep_entries.splice(idx,1);
  sd(wk,data);
  renderSleepEntries(data.sleep_entries||[],data);
  renderBottles();
}

// ── Celebration ───────────────────────────────────────────────────
function checkAllFull(data){
  if(ZONES.every(z=>getZoneHours(data,z.id)>=z.target))triggerCelebration();
}

function triggerCelebration(){
  const cel=document.getElementById('celebration');
  cel.classList.add('show');
  const colors=['#e8693d','#2178d4','#1a8c6e','#5a4fd0','#888780','#3d3a8c','#f5c842'];
  for(let i=0;i<72;i++){
    const p=document.createElement('div'); p.className='confetti-piece';
    const sz=5+Math.random()*8;
    p.style.cssText=`left:${Math.random()*100}%;top:-10px;background:${colors[i%colors.length]};width:${sz}px;height:${sz}px;border-radius:${Math.random()>0.5?'50%':'2px'};animation-duration:${1.8+Math.random()*2}s;animation-delay:${Math.random()*0.8}s`;
    cel.appendChild(p); setTimeout(()=>p.remove(),5000);
  }
  setTimeout(()=>cel.classList.remove('show'),4200);
}

// ── Week nav ──────────────────────────────────────────────────────
function changeWeek(o){currentOffset=o===0?0:currentOffset+o; renderBottles();}

// ── Init ──────────────────────────────────────────────────────────
async function init(){
  setStatus('loading…');
  await _loadAll();
  setStatus('');
  renderBottles();
}

init();
</script>
